version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hospital_transport_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HospitalTransportDB
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..  
      dockerfile: HospitalTransport.API/Dockerfile
    container_name: hospital_transport_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=HospitalTransportDB;Username=postgres;Password=postgres
    ports:
      - "8088:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital_network
    restart: unless-stopped

  frontend:
    build:
      context: ../../../front-end/hospital-transport-web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://192.168.0.249:8088/api
    container_name: hospital_transport_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.0.249:8088/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - hospital_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  hospital_network:
    driver: bridge