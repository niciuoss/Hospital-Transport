version: '3.8'

# Compose para rodar o Hospital Transport no servidor Ubuntu (192.168.0.72),
# ao lado do sistema que já existe lá na porta 3000.
#
# Diferente do docker-compose.yml original: aqui os serviços "api" e "frontend"
# usam "image:" (imagens já prontas, carregadas via `docker load` a partir dos
# .tar em migracao-servidor/backups/) em vez de "build:" — não é preciso ter
# o código-fonte nem compilar nada no servidor Ubuntu.
#
# Uso: docker compose --env-file .env.ubuntu -f docker-compose.ubuntu.yml up -d

services:
  postgres:
    image: postgres:15
    container_name: hospital_transport_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: HospitalTransportDB
    ports:
      - "${POSTGRES_PORT:-5440}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    image: hospitaltransportapi-api:latest
    container_name: hospital_transport_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=HospitalTransportDB;Username=postgres;Password=postgres
    ports:
      - "${API_PORT:-8089}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital_network
    restart: unless-stopped

  frontend:
    image: hospitaltransportapi-frontend:ubuntu
    container_name: hospital_transport_frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      - api
    networks:
      - hospital_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  hospital_network:
    driver: bridge
